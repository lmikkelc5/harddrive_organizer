name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + end-to-end tests
        run: pytest -q
      - name: Test drive (both phases, second-run checks, 500-photo import)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python -m photo_organizer.testdrive full "$RUNNER_TEMP/drive" --big 500

  build:
    # macOS minutes are expensive: build only for main, tags, and manual runs.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: test
    runs-on: macos-latest  # Apple Silicon
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt pyinstaller

      - name: Build Organize photos.app
        run: pyinstaller --noconfirm --clean packaging/organize_photos.spec

      - name: Check it's arm64 and signed
        run: |
          BIN="dist/Organize photos.app/Contents/MacOS/Organize photos"
          file "$BIN"
          lipo -archs "$BIN" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "dist/Organize photos.app"

      - name: Full test drive with the built app
        env:
          ORGANIZE_PHOTOS_NO_UPDATE: "1"   # test the code inside this build, not the latest release
        run: python -m photo_organizer.testdrive full "$RUNNER_TEMP/appdrive" --app "dist/Organize photos.app/Contents/MacOS/Organize photos"

      - name: Show the app shell's log if the built app failed
        if: failure()
        run: |
          LOG="$HOME/Library/Application Support/Organize photos/updates.log"
          if [ -f "$LOG" ]; then
            echo "::error title=shell log::$(tail -c 1500 "$LOG" | tr '\n' '|')"
          else
            echo "::error title=shell log::no shell log at $LOG"
          fi

      - name: Remote update smoke test (good update, then a broken one)
        run: |
          APP="dist/Organize photos.app/Contents/MacOS/Organize photos"
          export ORGANIZE_PHOTOS_HOME="$RUNNER_TEMP/shellhome"
          DRIVE="$RUNNER_TEMP/updrive"
          mkdir -p "$DRIVE/Put new photos here"

          # A newer release: the app must download it and run it.
          python packaging/make_code_zip.py --out "$RUNNER_TEMP/rel1" --version 9.9.9 --local-release
          ORGANIZE_PHOTOS_UPDATE_SOURCE="file://$RUNNER_TEMP/rel1/latest.json" "$APP" --drive "$DRIVE"
          grep -h "Code: 9.9.9 (update)" "$DRIVE"/.photo-organizer/logs/run-*.log

          # A broken release: the app must fall back and keep working.
          rm -f "$DRIVE"/.photo-organizer/logs/run-*.log
          python packaging/make_code_zip.py --out "$RUNNER_TEMP/rel2" --version 9.9.10 --local-release --broken
          ORGANIZE_PHOTOS_UPDATE_SOURCE="file://$RUNNER_TEMP/rel2/latest.json" "$APP" --drive "$DRIVE"
          grep -h "Code: 9.9.9 (update)" "$DRIVE"/.photo-organizer/logs/run-*.log
          grep -q '"9.9.10"' "$ORGANIZE_PHOTOS_HOME/state.json"
          cat "$ORGANIZE_PHOTOS_HOME/updates.log"

      - name: Zip (ditto keeps the .app bundle intact)
        run: |
          VERSION=$(python -c "import photo_organizer; print(photo_organizer.__version__)")
          echo "ZIP=Organize-photos-$VERSION.zip" >> "$GITHUB_ENV"
          ditto -c -k --keepParent "dist/Organize photos.app" "Organize-photos-$VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Organize-photos
          path: ${{ env.ZIP }}
          retention-days: 30

      - name: Publish GitHub Release (app + code-only update)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import photo_organizer; print(photo_organizer.__version__)")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match __version__ $VERSION"; exit 1
          fi
          python packaging/make_code_zip.py --out release
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Organize photos $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "$ZIP" release/photo_organizer-code.zip release/photo_organizer-code.zip.sha256 --clobber
