name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + end-to-end tests
        run: pytest -q
      - name: Test drive (make, organize, check)
        shell: bash
        run: |
          python -m photo_organizer.testdrive make "$RUNNER_TEMP/drive"
          python -m photo_organizer --drive "$RUNNER_TEMP/drive" --timezone America/Los_Angeles
          python -m photo_organizer.testdrive check "$RUNNER_TEMP/drive"

  build:
    # macOS minutes are expensive: build only for main, tags, and manual runs.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: test
    runs-on: macos-latest  # Apple Silicon
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt pyinstaller

      - name: Build Organize Photos.app
        run: pyinstaller --noconfirm --clean packaging/organize_photos.spec

      - name: Check it's arm64 and signed
        run: |
          BIN="dist/Organize Photos.app/Contents/MacOS/Organize Photos"
          file "$BIN"
          lipo -archs "$BIN" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "dist/Organize Photos.app"

      - name: Smoke test the built app on a test drive
        run: |
          python -m photo_organizer.testdrive make "$RUNNER_TEMP/appdrive"
          "dist/Organize Photos.app/Contents/MacOS/Organize Photos" --drive "$RUNNER_TEMP/appdrive" --timezone America/Los_Angeles
          python -m photo_organizer.testdrive check "$RUNNER_TEMP/appdrive"

      - name: Zip (ditto keeps the .app bundle intact)
        run: |
          VERSION=$(python -c "import photo_organizer; print(photo_organizer.__version__)")
          echo "ZIP=Organize-Photos-$VERSION.zip" >> "$GITHUB_ENV"
          ditto -c -k --keepParent "dist/Organize Photos.app" "Organize-Photos-$VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Organize-Photos
          path: ${{ env.ZIP }}
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Organize Photos $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
