[project]
name = "organize-photos"
version = "0.1.0"
description = "Sorts photos on an external drive, for someone who isn't tech-savvy."
requires-python = ">=3.12"
dependencies = ["Pillow>=11", "pillow-heif>=0.20", "tzdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
